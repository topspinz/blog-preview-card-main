<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png" />
  <link rel="stylesheet" href="./assets/css/styles.css" />
  <link rel="stylesheet" href="./assets/css/global.css" />
  <link rel="stylesheet" href="./assets/css/styleguide.css" />
  <title>Frontend Mentor | Blog preview card</title>
</head>

<body>
  <main>
    <article class="card">
      <img src="./assets/images/illustration-article.svg" alt="Web 3.0 image" class="card__image" />
      <div class="content">
        <div class="category">
          <div class="text-wrapper">Learning</div>
        </div>
        <div class="publish-date">Published 21 Dec 2023</div>
        <a href="#">
          <h2 class="title">HTML & CSS foundations</h2>
        </a>
        <p class="description">
          These languages are the backbone of every website, defining
          structure, content, and presentation.
        </p>
      </div>
      <footer class="author">
        <img class="userpic" alt="profile picture of Greg Hooper" src="./assets/images/image-avatar.webp" />
        <div class="authorname">Greg Hooper</div>
      </footer>
    </article>
  </main>
</body>

</html>
